name: Set up CanadaLogin release tooling
description: Install the Python tooling that matches the reusable workflow ref.

inputs:
  python-version:
    description: Python version used by the release tooling.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install release tooling
      shell: bash
      env:
        RELEASE_SYSTEM_ROOT: ${{ github.action_path }}/../..
      run: |
        python -m pip install --disable-pip-version-check --require-hashes \
          --no-deps -r "$RELEASE_SYSTEM_ROOT/requirements.lock"
        python -m pip install --disable-pip-version-check --no-build-isolation \
          --no-deps "$RELEASE_SYSTEM_ROOT"