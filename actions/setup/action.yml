# This is a composite action that sets up Python, dependencies, and the CLI.
# It is used by all workflows to ensure a consistent running environment.

name: Set up CanadaLogin release tooling
description: Install the Python tooling that matches the reusable workflow ref.

inputs:
  python-version:
    description: Python version used by the release tooling.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}

    # Callers often check out their repository before this step, so the workspace can hold
    # caller-controlled files. Running a module with -m puts the current directory first on sys.path, so a
    # top-level `pip` package there would run instead of pip. Run from this action's directory
    # and in isolated mode (-I: no current directory or user site on sys.path, PYTHON* variables
    # ignored) so caller files cannot run here, whatever the step order.
    - name: Install release tooling
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        RELEASE_PIPELINE_ROOT: ${{ github.action_path }}/../..
      run: |
        python -I -m pip install --disable-pip-version-check --require-hashes \
          --no-deps -r "$RELEASE_PIPELINE_ROOT/requirements.lock"
        python -I -m pip install --disable-pip-version-check --no-build-isolation \
          --no-deps "$RELEASE_PIPELINE_ROOT"