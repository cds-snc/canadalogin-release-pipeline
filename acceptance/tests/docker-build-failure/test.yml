schema_version: 1
id: docker-build-failure
name: Expected ECS build failure
enabled: true

release:
  config_path: release-pipeline-configuration.yml
  environment: dev
  github_environment: acceptance-tests
  pipeline_id_prefix: acceptance-docker-build-failure
  expected_release_result: failure
  rebuild: true

infrastructure:
  terraform_directory: infra

verification:
  script: verify.py
  aws_role: cl-acceptance-docker-failure-actions
  resources:
    app_name: cl-acceptance-docker-failure
    ecr_repository: cl-acceptance-docker-failure
    cluster: cl-acceptance-docker-failure
    service: cl-acceptance-docker-failure-app
    ssm_parameter: /ecs/cl-acceptance-docker-failure/cl-acceptance-docker-failure-app/container-image
    notification_capture_function: enabled
    notification_capture_table: cl-acceptance-docker-failure-notifications
