schema_version: 2
application: release-pipeline acceptance React ECS
profile: spa-ecs
environments: [dev]

frontend:
  directory: acceptance/tests/react-ecs/frontend
  environment:
    VITE_RELEASE_SHA: "{sha}"
  delete_stale_files: true
  invalidation_paths: []

backend:
  dockerfile: acceptance/tests/react-ecs/backend/Dockerfile
  build_args:
    APP_VERSION: "{release_version}"
