[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canadalogin-release-system"
version = "0.1.0"
description = "Shared release pipeline tooling for CanadaLogin applications"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
canadalogin-release = "canadalogin_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]