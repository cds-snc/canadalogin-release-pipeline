[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "canadalogin-release-system"
version = "1.0.14"
description = "Shared release pipeline tooling for CanadaLogin applications"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
canadalogin-release = "canadalogin_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]