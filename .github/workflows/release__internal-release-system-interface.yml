# This is the underlying workflow for the CanadaLogin release system.
# This provides GitHub Actions features like concurrency, matrix build fanout,
# job dependency and more. The bulk of the logic is implemented in src/.
# It is called by `release__release-system.yml`.

name: CanadaLogin internal release system interface

on:
  workflow_call:
    outputs:
      release-result:
        description: Overall conclusion derived from release jobs.
        value: ${{ jobs.release_result.outputs.release-result }}
      required-builds-result:
        description: Conclusion of the required builds job.
        value: ${{ jobs.release_result.outputs.required-builds-result }}
      deploy-result:
        description: Conclusion of the deployment job.
        value: ${{ jobs.release_result.outputs.deploy-result }}
    inputs:
      config-path:
        required: true
        type: string
      aws-account-id:
        required: false
        default: ""
        type: string
      aws-region:
        required: false
        default: ""
        type: string
      github-environment:
        required: false
        default: ""
        type: string
      pipeline_id:
        required: false
        default: default
        type: string
      environment:
        required: false
        default: ""
        type: string
      force-redeploy:
        required: false
        default: false
        type: boolean
      rebuild:
        required: false
        default: false
        type: boolean
      release-pipeline-vars:
        required: false
        default: ""
        type: string
      alert-webhook-override:
        required: false
        default: ""
        type: string
      allow-failure:
        required: false
        default: false
        type: boolean

concurrency:
  group: canadalogin-release-${{ github.repository }}-${{ inputs.pipeline_id }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'deploy' }}

jobs:
  plan:
    name: Validate and plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_please: ${{ steps.plan.outputs.release_please }}
      has_promotions: ${{ steps.plan.outputs.has_promotions }}
      has_required_builds: ${{ steps.plan.outputs.has_required_builds }}
      has_deployments: ${{ steps.plan.outputs.has_deployments }}
      promotions: ${{ steps.plan.outputs.promotions }}
      required_build_matrix: ${{ steps.plan.outputs.required_build_matrix }}
      deployment_matrix: ${{ steps.plan.outputs.deployment_matrix }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up release tooling
        uses: $/actions/setup

      - name: Validate configuration and plan jobs
        id: plan
        env:
          BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          CONFIG_PATH: ${{ inputs.config-path }}
          MANUAL_ENVIRONMENT: ${{ inputs.environment }}
          PLAN_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          RELEASE_FORCE_DEPLOY: ${{ inputs.force-redeploy }}
          RELEASE_REBUILD: ${{ inputs.rebuild }}
          REPOSITORY_DISPATCH_EVENT: ${{ github.event.action || '' }}
        run: |
          plan_outputs="$(mktemp)"
          GITHUB_OUTPUT="$plan_outputs" canadalogin-release plan \
            --config "$CONFIG_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --sha "$PLAN_SHA" \
            --before-sha "$BEFORE_SHA" \
            --environment "$MANUAL_ENVIRONMENT" \
            --repository-dispatch-event "$REPOSITORY_DISPATCH_EVENT" \
            --github-output

          cat "$plan_outputs" >> "$GITHUB_OUTPUT"
          printf 'Required builds:\n'
          sed -n 's/^required_build_matrix=//p' "$plan_outputs" | jq .
          printf '\nDeployments:\n'
          sed -n 's/^deployment_matrix=//p' "$plan_outputs" | jq .
          rm "$plan_outputs"

  deployment-impact:
    name: Comment on deployment impact
    needs: plan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up release tooling
        uses: $/actions/setup

      - name: Update deployment impact comment
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PROMOTIONS: ${{ needs.plan.outputs.promotions }}
        run: >-
          canadalogin-release pr-comment
          --config "$CONFIG_PATH"
          --repository-name "$GITHUB_REPOSITORY"
          --pull-request "${{ github.event.pull_request.number }}"
          --api-url "$GITHUB_API_URL"

  release_please:
    name: Run release-please
    needs: plan
    if: needs.plan.outputs.release_please == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create release bot token
        id: release_bot_token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CDS_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.CDS_RELEASE_BOT_PRIVATE_KEY }}

      - name: Run release-please
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.release_bot_token.outputs.token }}

  pipeline_failure:
    name: Notify about pipeline failure
    needs: [plan, release_please]
    if: >-
      ${{
        always() &&
        (needs.plan.result == 'failure' || needs.plan.result == 'cancelled' ||
         needs.release_please.result == 'failure' || needs.release_please.result == 'cancelled')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up release tooling
        uses: $/actions/setup

      - name: Notify Slack
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5 }}
        run: >-
          canadalogin-release pipeline-failure
          --application "$GITHUB_REPOSITORY"
          --workflow-url "$WORKFLOW_URL"

  required_builds:
    name: ${{ matrix.name && format('Build {0} ({1})', matrix.name, matrix.target_environment) || 'Build artifacts' }}
    needs: [plan, release_please]
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        (needs.release_please.result == 'success' || needs.release_please.result == 'skipped')
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.required_build_matrix) }}
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release__build.yml
    with:
      config-path: ${{ inputs.config-path }}
      aws-account-id: ${{ inputs.aws-account-id }}
      aws-region: ${{ inputs.aws-region || matrix.aws_region }}
      github-environment: ${{ inputs.github-environment || matrix.environment }}
      enabled: ${{ matrix.enabled }}
      name: ${{ matrix.name }}
      environment: ${{ matrix.environment }}
      target-environment: ${{ matrix.target_environment }}
      source-sha: ${{ matrix.sha }}
      notify-failure: ${{ matrix.notify_failure }}
      kind: ${{ matrix.kind }}
      aws-role: ${{ matrix.aws_role }}
      dns-audit: ${{ matrix.dns_audit }}
      node-version: ${{ matrix.node_version }}
      sbom-enabled: ${{ matrix.sbom_enabled }}
      sbom-name: ${{ matrix.sbom_name }}
      sbom-dockerfile: ${{ matrix.sbom_dockerfile }}
      release-pipeline-vars: ${{ inputs.release-pipeline-vars }}
      alert-webhook-override: ${{ inputs.alert-webhook-override }}
      allow-failure: ${{ inputs.allow-failure }}
    secrets: inherit

  deploy:
    name: ${{ matrix.environment && format('Deploy {0}', matrix.environment) || 'Deploy environments' }}
    needs: [plan, release_please, required_builds]
    if: >-
      ${{
        always() &&
        needs.plan.result == 'success' &&
        (needs.release_please.result == 'success' || needs.release_please.result == 'skipped') &&
        (needs.required_builds.result == 'success' || needs.required_builds.result == 'skipped') &&
        (needs.required_builds.outputs.result == 'success' || needs.required_builds.outputs.result == '')
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.deployment_matrix) }}
    uses: ./.github/workflows/release__deploy.yml
    with:
      config-path: ${{ inputs.config-path }}
      aws-account-id: ${{ inputs.aws-account-id }}
      aws-region: ${{ inputs.aws-region || matrix.aws_region }}
      github-environment: ${{ inputs.github-environment || matrix.environment }}
      pipeline_id: ${{ inputs.pipeline_id }}
      enabled: ${{ matrix.enabled }}
      environment: ${{ matrix.environment }}
      sha: ${{ matrix.sha }}
      s3-role: ${{ matrix.s3_role }}
      ecs-role: ${{ matrix.ecs_role }}
      notify: ${{ matrix.notify }}
      notify-failure: ${{ matrix.notify_failure }}
      release-pipeline-vars: ${{ inputs.release-pipeline-vars }}
      alert-webhook-override: ${{ inputs.alert-webhook-override }}
      allow-failure: ${{ inputs.allow-failure }}
    secrets: inherit

  release_result:
    name: Report release result
    if: always()
    needs: [plan, release_please, required_builds, deploy]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      release-result: ${{ steps.result.outputs.release-result }}
      required-builds-result: ${{ steps.result.outputs.required-builds-result }}
      deploy-result: ${{ steps.result.outputs.deploy-result }}
    steps:
      - name: Report job conclusions
        id: result
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RELEASE_PLEASE_RESULT: ${{ needs.release_please.result }}
          REQUIRED_BUILDS_JOB_RESULT: ${{ needs.required_builds.result }}
          REQUIRED_BUILDS_REPORTED_RESULT: ${{ needs.required_builds.outputs.result }}
          DEPLOY_JOB_RESULT: ${{ needs.deploy.result }}
          DEPLOY_REPORTED_RESULT: ${{ needs.deploy.outputs.result }}
        run: |
          set -euo pipefail
          required_builds_result="$REQUIRED_BUILDS_JOB_RESULT"
          if [[ "$required_builds_result" == success && -n "$REQUIRED_BUILDS_REPORTED_RESULT" ]]; then
            required_builds_result="$REQUIRED_BUILDS_REPORTED_RESULT"
          fi
          deploy_result="$DEPLOY_JOB_RESULT"
          if [[ "$deploy_result" == success && -n "$DEPLOY_REPORTED_RESULT" ]]; then
            deploy_result="$DEPLOY_REPORTED_RESULT"
          fi
          release_result=success
          for job_result in "$PLAN_RESULT" "$RELEASE_PLEASE_RESULT" "$required_builds_result" "$deploy_result"; do
            if [[ "$job_result" == failure || "$job_result" == cancelled ]]; then
              release_result=failure
            fi
          done
          {
            printf 'release-result=%s\n' "$release_result"
            printf 'required-builds-result=%s\n' "$required_builds_result"
            printf 'deploy-result=%s\n' "$deploy_result"
          } >> "$GITHUB_OUTPUT"