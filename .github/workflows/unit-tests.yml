name: Unit tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up release tooling
        uses: ./actions/setup

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.4

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint GitHub Actions workflows
        run: >-
          "$(go env GOPATH)/bin/actionlint" .github/workflows/*.yml

      - name: Validate acceptance Terraform
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          for terraform_directory in acceptance/terraform acceptance/tests/*/infra; do
            TF_DATA_DIR="$(mktemp -d)"
            export TF_DATA_DIR
            terraform -chdir="$terraform_directory" init -backend=false -input=false -lockfile=readonly -no-color
            terraform -chdir="$terraform_directory" validate -no-color
            rm -rf "$TF_DATA_DIR"
          done

      - name: Compile Python package
        run: python -m compileall -q src

      - name: Run tests
        run: python -m unittest discover -s tests -v