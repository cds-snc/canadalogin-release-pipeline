name: Release gate

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: compute release gate
    runs-on: ubuntu-latest
    steps:
      - name: Publish release-gate status
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          acceptance_context='Integration / acceptance tests'
          release_branch='release-please--branches--main'

          post() {
            gh api --method POST "repos/$REPOSITORY/statuses/$HEAD_SHA" \
              -f state="$1" \
              -f context='release-gate' \
              -f description="$2" \
              -f target_url="$RUN_URL" >/dev/null
            printf '%s: %s\n' "$1" "$2"
          }

          if [[ "$HEAD_REPO" != "$REPOSITORY" || "$HEAD_REF" != "$release_branch" || "$AUTHOR_TYPE" != "Bot" ]]; then
            post success 'Not a release pull request'
            exit 0
          fi

          state="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA/statuses?per_page=100" |
            jq -r --arg context "$acceptance_context" \
            '[.[] | select(.context == $context)] | .[0].state // "pending"')"

          case "$state" in
            success) post success 'Acceptance tests passed for this commit' ;;
            pending) post pending 'Waiting for acceptance tests' ;;
            *)       post failure "Acceptance tests: $state" ;;
          esac