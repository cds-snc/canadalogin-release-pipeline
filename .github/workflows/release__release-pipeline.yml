# This is the end-user-facing workflow for the CanadaLogin release pipeline. It provides a simple interface for
# manual deployments and rebuilds. The bulk of the logic is implemented in src/.
name: CanadaLogin release pipeline

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the caller repository's release configuration.
        required: false
        default: .github/release-pipeline-configuration.yml
        type: string
      environment:
        description: Manual deployment target. Use "all" for every enabled environment.
        required: false
        default: ""
        type: string
      force-redeploy:
        description: Force deployments to all enabled environments.
        required: false
        default: false
        type: boolean
      rebuild:
        description: Rebuild artifacts during a manual deployment.
        required: false
        default: false
        type: boolean

jobs:
  release:
    uses: ./.github/workflows/release__internal-release-pipeline-interface.yml
    with:
      config-path: ${{ inputs.config-path }}
      environment: ${{ inputs.environment }}
      force-redeploy: ${{ inputs.force-redeploy }}
      rebuild: ${{ inputs.rebuild }}
    secrets: inherit
