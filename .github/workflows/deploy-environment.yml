name: Deploy release environment

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the caller repository's release configuration.
        required: true
        type: string
      pipeline_id:
        description: Concurrency namespace for independent pipelines in one repository.
        required: false
        default: default
        type: string
      aws-account-id:
        description: Optional AWS account ID override.
        required: false
        default: ""
        type: string
      enabled:
        description: Run this matrix entry.
        required: false
        default: true
        type: boolean
      environment:
        description: Logical environment to deploy.
        required: true
        type: string
      github-environment:
        description: GitHub environment supplying variables and secrets.
        required: false
        default: ""
        type: string
      create-deployment:
        description: Create a GitHub deployment record for the environment.
        required: false
        default: true
        type: boolean
      sha:
        description: Desired commit SHA resolved by the planning job.
        required: true
        type: string
      aws-region:
        description: AWS region containing the application infrastructure.
        required: false
        default: ca-central-1
        type: string
      s3-role:
        description: AWS IAM role used by S3 and CloudFront deployments.
        required: false
        default: ""
        type: string
      ecs-role:
        description: AWS IAM role used by ECS and SSM deployments.
        required: false
        default: ""
        type: string
      notify:
        description: Send start and success deployment notifications.
        required: false
        default: false
        type: boolean
      notify-failure:
        description: Send a deployment failure notification.
        required: false
        default: true
        type: boolean
      release-pipeline-vars:
        description: Optional JSON object of non-secret release variables for isolated callers.
        required: false
        default: ""
        type: string
      alert-webhook-override:
        description: Optional endpoint used instead of configured alert Slack webhooks.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: inputs.enabled
    name: Deploy
    runs-on: ubuntu-latest
    concurrency:
      group: canadalogin-release-${{ github.repository }}-${{ inputs.pipeline_id }}-${{ inputs.environment }}
      queue: max
    environment:
      name: ${{ inputs.github-environment || inputs.environment }}
      deployment: ${{ inputs.create-deployment }}
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release tooling
        uses: $/actions/setup

      - name: Resolve AWS roles
        id: resolve-roles
        env:
          ECS_DEFAULT_ROLE: ${{ vars[inputs.ecs-role] }}
          ECS_ROLE_VARIABLE: ${{ inputs.ecs-role }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || '{}' }}
          S3_DEFAULT_ROLE: ${{ vars[inputs.s3-role] }}
          S3_ROLE_VARIABLE: ${{ inputs.s3-role }}
        run: |
          set -euo pipefail

          resolve_role() {
            local variable_name="$1"
            local default_role="$2"
            if [[ -z "$variable_name" ]]; then
              return 0
            fi
            local role="$default_role"
            local configured
            configured=$(jq -r --arg name "$variable_name" '.[$name] // empty' <<< "$RELEASE_PIPELINE_VARS")
            if [[ -n "$configured" ]]; then
              role="$configured"
            fi
            printf '%s' "${role:-$variable_name}"
          }

          printf 's3_role=%s\n' "$(resolve_role "$S3_ROLE_VARIABLE" "$S3_DEFAULT_ROLE")" >> "$GITHUB_OUTPUT"
          printf 'ecs_role=%s\n' "$(resolve_role "$ECS_ROLE_VARIABLE" "$ECS_DEFAULT_ROLE")" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about deployment start
        if: inputs.notify
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_1: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_1 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_2: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_2 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_3: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_3 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_4: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_4 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_5: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_5 }}
        run: >-
          canadalogin-release notify
          --status deploy-start
          --config "$CONFIG_PATH"
          --environment "$DEPLOY_ENVIRONMENT"
          --sha "${{ inputs.sha }}"
          --workflow-url "$WORKFLOW_URL"

      - name: Configure AWS credentials for S3 preflight
        if: inputs.s3-role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}:role/${{ steps.resolve-roles.outputs.s3_role }}
          role-session-name: CanadaLoginReleaseS3Deploy
          aws-region: ${{ inputs.aws-region }}

      - name: Preflight S3 artifacts
        if: inputs.s3-role != ''
        env: &deployment-environment
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ inputs.aws-region }}
          CONFIG_PATH: ${{ inputs.config-path }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
        run: >-
          canadalogin-release preflight-s3
          --config "$CONFIG_PATH"
          --environment "$DEPLOY_ENVIRONMENT"
          --sha "${{ inputs.sha }}"

      - name: Configure AWS credentials for ECS preflight
        if: inputs.ecs-role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}:role/${{ steps.resolve-roles.outputs.ecs_role }}
          role-session-name: CanadaLoginReleaseEcsDeploy
          aws-region: ${{ inputs.aws-region }}

      - name: Preflight ECR images and ECS services
        if: inputs.ecs-role != ''
        env: *deployment-environment
        run: >-
          canadalogin-release preflight-ecs
          --config "$CONFIG_PATH"
          --environment "$DEPLOY_ENVIRONMENT"
          --sha "${{ inputs.sha }}"

      - name: Configure AWS credentials for S3 and CloudFront deployment
        if: inputs.s3-role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}:role/${{ steps.resolve-roles.outputs.s3_role }}
          role-session-name: CanadaLoginReleaseS3Deploy
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy S3 and CloudFront resources
        if: inputs.s3-role != ''
        env: *deployment-environment
        run: >-
          canadalogin-release deploy-s3
          --config "$CONFIG_PATH"
          --environment "$DEPLOY_ENVIRONMENT"
          --sha "${{ inputs.sha }}"

      - name: Configure AWS credentials for ECS and SSM deployment
        if: inputs.ecs-role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}:role/${{ steps.resolve-roles.outputs.ecs_role }}
          role-session-name: CanadaLoginReleaseEcsDeploy
          aws-region: ${{ inputs.aws-region }}

      - name: Deploy ECS services
        if: inputs.ecs-role != ''
        env: *deployment-environment
        run: >-
          canadalogin-release deploy-ecs
          --config "$CONFIG_PATH"
          --environment "$DEPLOY_ENVIRONMENT"
          --sha "${{ inputs.sha }}"

      - name: Notify Slack about deployment success
        if: inputs.notify
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_1: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_1 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_2: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_2 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_3: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_3 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_4: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_4 }}
          RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_5: ${{ secrets.RELEASE_PIPELINE_DEPLOY_INFO_SLACK_WEBHOOK_5 }}
        run: >-
          canadalogin-release notify
          --status deploy-success
          --config "$CONFIG_PATH"
          --environment "$DEPLOY_ENVIRONMENT"
          --sha "${{ inputs.sha }}"
          --workflow-url "$WORKFLOW_URL"

      - name: Notify Slack about deployment failure
        if: failure() && inputs.notify-failure
        env:
          CONFIG_PATH: ${{ inputs.config-path }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_OVERRIDE: ${{ inputs.alert-webhook-override }}
        run: >-
          canadalogin-release notify
          --status deploy-failure
          --config "$CONFIG_PATH"
          --environment "$DEPLOY_ENVIRONMENT"
          --sha "${{ inputs.sha }}"
          --workflow-url "$WORKFLOW_URL"