# Build one container image and sign SLSA build provenance for it.
# This workflow is called by the `image` job of `release__build.yml`.
#
# This file holds the only signing identity that deployments trust. A Sigstore certificate names the reusable
# workflow FILE (job_workflow_ref) and its commit (job_workflow_sha), not the job, so two rules keep that identity
# meaningful:
#
# 1. No caller-controlled code runs on a runner here. The build job runs only this repository's release tooling and
#    `docker build`, whose Dockerfile steps execute inside BuildKit containers, not on the runner. `--require-kind
#    docker` stops a caller configuration from turning this into a command build. Command builds (npm and similar)
#    run in `release__build.yml`, whose identity is deliberately untrusted.
# 2. The workflow signs only an image it built in this run. The subject digest comes from this file's build job, never
#    from a workflow input, so calling this workflow directly cannot attest an image built anywhere else.
#
# Keep it that way: no command builds, no setup-node or package installs from the caller repository, no workflow input
# that names a digest, and no caller-supplied actions.

name: Build and attest container image

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the caller repository's release configuration.
        required: true
        type: string
      name:
        description: Build definition name.
        required: true
        type: string
      environment:
        description: Logical build environment used by release tooling.
        required: true
        type: string
      github-environment:
        description: GitHub environment supplying variables and secrets.
        required: false
        default: ""
        type: string
      source-sha:
        description: Caller repository commit to build and publish.
        required: true
        type: string
      aws-role:
        description: AWS IAM role name, or an empty string when AWS is not needed.
        required: false
        default: ""
        type: string
      aws-account-id:
        description: Optional AWS account ID override.
        required: false
        default: ""
        type: string
      aws-region:
        description: AWS region used for artifact publication.
        required: false
        default: ca-central-1
        type: string
      dns-audit:
        description: Enable the CDS DNS audit proxy.
        required: false
        default: false
        type: boolean
      release-pipeline-vars:
        description: Optional JSON object of non-secret release variables for isolated callers.
        required: false
        default: ""
        type: string
      allow-failure:
        description: Allow a build failure while reporting it to the caller.
        required: false
        default: false
        type: boolean
    secrets:
      LOG_ANALYTICS_WORKSPACE_ID:
        required: false
      LOG_ANALYTICS_WORKSPACE_KEY:
        required: false
    outputs:
      result:
        description: Actual build result.
        value: ${{ jobs.build.outputs.result }}
      image_uri:
        description: Image URI published by the build.
        value: ${{ jobs.build.outputs.image_uri }}
      image_digest:
        description: Image manifest digest published by the build.
        value: ${{ jobs.build.outputs.image_digest }}

permissions: {}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      image_repository: ${{ steps.build.outputs.image_repository }}
      image_digest: ${{ steps.build.outputs.image_digest }}
      image_attestable: ${{ steps.build.outputs.image_attestable }}
      result: ${{ steps.result.outputs.result }}
    environment:
      name: ${{ inputs.github-environment || inputs.environment }}
      deployment: false
    steps:
      # Install the release tooling before any caller files exist in the workspace. The setup action already runs
      # pip isolated from the workspace (a caller's top-level `pip` package must never run); installing first keeps
      # this job safe even if that action regresses.
      - name: Set up release tooling
        uses: $/actions/setup

      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Audit DNS requests
        if: inputs.dns-audit
        uses: cds-snc/dns-proxy-action@9ad793100229573be3f5ba78cc69ec523f2c8b7e # main
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          DNS_PROXY_LOGANALYTICSSHAREDKEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}

      - name: Resolve AWS role
        if: inputs.aws-role != ''
        id: resolve-role
        env:
          DEFAULT_ROLE: ${{ vars[inputs.aws-role] }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || '{}' }}
          ROLE_VARIABLE: ${{ inputs.aws-role }}
        run: |
          set -euo pipefail
          role="$DEFAULT_ROLE"
          configured=$(jq -r --arg name "$ROLE_VARIABLE" '.[$name] // empty' <<< "$RELEASE_PIPELINE_VARS")
          if [[ -n "$configured" ]]; then
            role="$configured"
          fi
          printf 'role=%s\n' "${role:-$ROLE_VARIABLE}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}:role/${{ steps.resolve-role.outputs.role }}
          role-session-name: CanadaLoginReleaseBuild
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and publish image
        id: build
        continue-on-error: ${{ inputs.allow-failure }}
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ inputs.aws-region }}
          BUILD_ENVIRONMENT: ${{ inputs.environment }}
          BUILD_NAME: ${{ inputs.name }}
          CONFIG_PATH: ${{ inputs.config-path }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
          SOURCE_SHA: ${{ inputs.source-sha }}
        run: >-
          canadalogin-release build
          --config "$CONFIG_PATH"
          --name "$BUILD_NAME"
          --environment "$BUILD_ENVIRONMENT"
          --sha "$GITHUB_SHA"
          --source-sha "$SOURCE_SHA"
          --github-ref "$GITHUB_REF"
          --require-kind docker
          --github-output

      - name: Record build result
        if: always()
        id: result
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: printf 'result=%s\n' "$BUILD_OUTCOME" >> "$GITHUB_OUTPUT"

  # Only images this run pushed AND built from GITHUB_SHA are attested. The provenance and signing certificate are
  # derived from the run's OIDC claims (GITHUB_SHA/GITHUB_REF), so an image built from another commit (source-sha)
  # would be attested with the wrong source, and a reused image belongs to the run that built it.
  attest:
    if: >-
      needs.build.outputs.result == 'success' &&
      needs.build.outputs.image_attestable == 'true' &&
      needs.build.outputs.image_digest != ''
    needs: build
    name: Sign build provenance
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Generate and store build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.build.outputs.image_repository }}
          subject-digest: ${{ needs.build.outputs.image_digest }}
