# This workflow listens for !test comments and dispatches acceptance__acceptance-tests.yml.

name: Request integration and acceptance tests

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  dispatch:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up release tooling
        uses: ./actions/setup

      - name: Validate request and dispatch prospective SHA
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 acceptance/runner.py request
          --comment-body "$COMMENT_BODY"
          --commenter "$COMMENTER"
          --pull-request "$PR_NUMBER"
          --repository "$REPOSITORY"
          --server-url "$SERVER_URL"
          --api-url "$GITHUB_API_URL"