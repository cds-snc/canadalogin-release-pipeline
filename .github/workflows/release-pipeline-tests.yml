name: Integration / acceptance tests

on:
  workflow_dispatch:
    inputs:
      release-sha:
        description: Prospective release-pipeline commit to exercise.
        required: true
        type: string
      pull-request-number:
        description: Pull request to update when the suite completes.
        required: true
        type: string

env:
  AWS_ACCOUNT_ID: "429694360874"
  AWS_REGION: ca-central-1

concurrency:
  group: canadalogin-release-acceptance-tests
  queue: max

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  validate_request:
    name: Validate release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate release-please pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
          RELEASE_SHA: ${{ inputs.release-sha }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          pr_json="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")"
          head_repository="$(jq -r '.head.repo.full_name // ""' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref // ""' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha // ""' <<<"$pr_json")"
          base_branch="$(jq -r '.base.ref // ""' <<<"$pr_json")"
          pr_state="$(jq -r '.state // ""' <<<"$pr_json")"
          author_type="$(jq -r '.user.type // ""' <<<"$pr_json")"
          release_label="$(jq -r '[.labels[]?.name] | index("autorelease: pending") // empty' <<<"$pr_json")"

          if [[ "$head_repository" != "$REPOSITORY" || "$base_branch" != "main" || "$pr_state" != "open" ]]; then
            printf '%s\n' 'Acceptance tests require an open pull request in the release repository targeting main.' >&2
            exit 1
          fi
          if [[ "$head_ref" != "release-please--branches--main" || "$author_type" != "Bot" || -z "$release_label" ]]; then
            printf '%s\n' 'Acceptance tests only run for release-please pull requests.' >&2
            exit 1
          fi
          if [[ "$head_sha" != "$RELEASE_SHA" || "$WORKFLOW_SHA" != "$RELEASE_SHA" || "$WORKFLOW_REF" != "$head_ref" ]]; then
            printf '%s\n' 'The requested SHA is not the current release-please pull request head.' >&2
            exit 1
          fi

  discover:
    name: Discover acceptance tests
    needs: validate_request
    if: needs.validate_request.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout prospective release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release-sha }}
          persist-credentials: false

      - name: Set up release tooling
        uses: ./actions/setup

      - name: Build acceptance test matrix
        id: matrix
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: python3 acceptance/runner.py matrix --github-output

  terraform:
    name: Apply acceptance infrastructure
    needs: [validate_request, discover]
    if: needs.validate_request.result == 'success' && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: acceptance-tests
      deployment: false
    steps:
      - name: Checkout prospective release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm prospective SHA
        env:
          EXPECTED_SHA: ${{ inputs.release-sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/cl-acceptance-terraform
          role-session-name: CanadaLoginAcceptanceTerraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform state store
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_STATE_BUCKET: cl-acceptance-tfstate-${{ env.AWS_ACCOUNT_ID }}
          TF_STATE_LOCK_TABLE: cl-acceptance-tfstate-lock-${{ env.AWS_ACCOUNT_ID }}
        run: ./acceptance/scripts/bootstrap-terraform-state.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.4

      - name: Format and initialize Terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_STATE_BUCKET: cl-acceptance-tfstate-${{ env.AWS_ACCOUNT_ID }}
          TF_STATE_LOCK_TABLE: cl-acceptance-tfstate-lock-${{ env.AWS_ACCOUNT_ID }}
        run: |
          terraform -chdir=acceptance/terraform fmt -check -recursive
          terraform -chdir=acceptance/terraform init -input=false -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=release-pipeline-acceptance/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE"
          terraform -chdir=acceptance/terraform validate

      - name: Apply acceptance Terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ env.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_github_oidc_subject_prefix: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
        run: terraform -chdir=acceptance/terraform apply -input=false -auto-approve

  acceptance:
    name: Acceptance test (${{ matrix.id }})
    needs: [terraform, discover]
    if: needs.terraform.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/acceptance-test.yml
    with:
      test-id: ${{ matrix.id }}
      release-sha: ${{ inputs.release-sha }}
      config-path: ${{ matrix.config_path }}
      terraform-directory: ${{ matrix.terraform_directory }}
      environment: ${{ matrix.environment }}
      github-environment: ${{ matrix.github_environment }}
      aws-role: ${{ matrix.aws_role }}
      aws-account-id: ${{ matrix.aws_account_id }}
      aws-region: ${{ matrix.aws_region }}
      pipeline-id-prefix: ${{ matrix.pipeline_id_prefix }}
      create-deployment: ${{ matrix.create_deployment }}
      expect-health-check-failure: ${{ matrix.expect_health_check_failure }}
      rebuild: ${{ matrix.rebuild }}
      release-pipeline-vars: ${{ matrix.release_pipeline_vars }}
    secrets: inherit

  assert_suite:
    name: Integration / acceptance suite result
    if: always()
    needs: [terraform, acceptance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every acceptance test
        env:
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
        run: |
          set -euo pipefail
          test "$TERRAFORM_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success

  report:
    name: Report integration / acceptance suite result
    if: always()
    needs: [validate_request, assert_suite]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      statuses: write
    steps:
      - name: Publish acceptance status
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release-sha }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_RESULT: ${{ needs.validate_request.result }}
          SUITE_RESULT: ${{ needs.assert_suite.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ "$VALIDATION_RESULT" == success && "$SUITE_RESULT" == success ]]; then
            state=success
            description='Integration and acceptance tests passed.'
          else
            state=failure
            description='Integration and acceptance tests failed.'
          fi

          gh api --method POST "repos/$REPOSITORY/statuses/$RELEASE_SHA" \
            -f state="$state" \
            -f context='Integration / acceptance tests' \
            -f description="$description" \
            -f target_url="$RUN_URL"

      - name: Trigger mergeability check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
          RELEASE_SHA: ${{ inputs.release-sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload="$(jq -n \
            --arg release_sha "$RELEASE_SHA" \
            --arg pull_request_number "$PR_NUMBER" \
            '{event_type: "integration-acceptance-completed", client_payload: {release_sha: $release_sha, pull_request_number: $pull_request_number}}')"
          gh api --method POST "repos/$REPOSITORY/dispatches" --input - <<<"$payload"

      - name: Comment on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull-request-number }}
          REPOSITORY: ${{ github.repository }}
          RESULT: ${{ needs.validate_request.result == 'success' && needs.assert_suite.result == 'success' && 'passed' || 'failed' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if ! gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" -f "body=Integration and acceptance tests $RESULT. $RUN_URL"; then
            printf '%s\n' 'Integration status was published, but the PR comment could not be posted.' >&2
          fi