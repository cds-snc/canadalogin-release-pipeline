# Build one release artifact according to the inputs.
# This workflow is called by `release__internal-release-pipeline-interface.yml`.

name: Build release artifact

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to the caller repository's release configuration.
        required: true
        type: string
      enabled:
        description: Run this matrix entry.
        required: false
        default: true
        type: boolean
      name:
        description: Build definition name.
        required: true
        type: string
      environment:
        description: Logical build environment used by release tooling.
        required: true
        type: string
      github-environment:
        description: GitHub environment supplying variables and secrets.
        required: false
        default: ""
        type: string
      target-environment:
        description: Environment whose desired artifact is being built.
        required: true
        type: string
      source-sha:
        description: Caller repository commit to build and publish.
        required: true
        type: string
      notify-failure:
        description: Send a Slack alert if this build fails.
        required: false
        default: true
        type: boolean
      kind:
        description: Build implementation kind.
        required: true
        type: string
      aws-role:
        description: AWS IAM role name, or an empty string when AWS is not needed.
        required: false
        default: ""
        type: string
      aws-account-id:
        description: Optional AWS account ID override.
        required: false
        default: ""
        type: string
      aws-region:
        description: AWS region used for artifact publication.
        required: false
        default: ca-central-1
        type: string
      dns-audit:
        description: Enable the CDS DNS audit proxy.
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version, or an empty string when Node.js is not needed.
        required: false
        default: ""
        type: string
      sbom-enabled:
        description: Generate and publish an image SBOM.
        required: false
        default: false
        type: boolean
      sbom-name:
        description: Published SBOM name.
        required: false
        default: ""
        type: string
      sbom-dockerfile:
        description: Dockerfile represented by the SBOM.
        required: false
        default: ""
        type: string
      release-pipeline-vars:
        description: Optional JSON object of non-secret release variables for isolated callers.
        required: false
        default: ""
        type: string
      alert-webhook-override:
        description: Optional endpoint used instead of configured alert Slack webhooks.
        required: false
        default: ""
        type: string
      allow-failure:
        description: Allow a build failure while reporting it to the caller.
        required: false
        default: false
        type: boolean
    outputs:
      result:
        description: Actual build result.
        value: ${{ jobs.build.outputs.result }}

jobs:
  build:
    if: inputs.enabled
    name: Build artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}
      result: ${{ steps.result.outputs.result }}
    environment:
      name: ${{ inputs.github-environment || inputs.environment }}
      deployment: false
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release tooling
        uses: $/actions/setup

      - name: Set up Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Audit DNS requests
        if: inputs.dns-audit
        uses: cds-snc/dns-proxy-action@9ad793100229573be3f5ba78cc69ec523f2c8b7e # main
        env:
          DNS_PROXY_FORWARDTOSENTINEL: "true"
          DNS_PROXY_LOGANALYTICSWORKSPACEID: ${{ secrets.LOG_ANALYTICS_WORKSPACE_ID }}
          DNS_PROXY_LOGANALYTICSSHAREDKEY: ${{ secrets.LOG_ANALYTICS_WORKSPACE_KEY }}

      - name: Resolve AWS role
        if: inputs.aws-role != ''
        id: resolve-role
        env:
          DEFAULT_ROLE: ${{ vars[inputs.aws-role] }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || '{}' }}
          ROLE_VARIABLE: ${{ inputs.aws-role }}
        run: |
          set -euo pipefail
          role="$DEFAULT_ROLE"
          configured=$(jq -r --arg name "$ROLE_VARIABLE" '.[$name] // empty' <<< "$RELEASE_PIPELINE_VARS")
          if [[ -n "$configured" ]]; then
            role="$configured"
          fi
          printf 'role=%s\n' "${role:-$ROLE_VARIABLE}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}:role/${{ steps.resolve-role.outputs.role }}
          role-session-name: CanadaLoginReleaseBuild
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        if: inputs.kind == 'docker'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Build and publish artifact
        id: build
        continue-on-error: ${{ inputs.allow-failure }}
        env:
          AWS_ACCOUNT_ID: ${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ inputs.aws-region }}
          BUILD_ENVIRONMENT: ${{ inputs.environment }}
          BUILD_NAME: ${{ inputs.name }}
          CONFIG_PATH: ${{ inputs.config-path }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
        run: >-
          canadalogin-release build
          --config "$CONFIG_PATH"
          --name "$BUILD_NAME"
          --environment "$BUILD_ENVIRONMENT"
          --sha "$GITHUB_SHA"
          --source-sha "${{ inputs.source-sha }}"
          --github-ref "$GITHUB_REF"
          --github-output

      - name: Record build result
        if: always()
        id: result
        run: printf 'result=%s\n' "${{ steps.build.outcome }}" >> "$GITHUB_OUTPUT"

      - name: Notify Slack about build failure
        if: (failure() || steps.build.outcome == 'failure') && inputs.notify-failure
        env:
          BUILD_ENVIRONMENT: ${{ inputs.target-environment }}
          BUILD_NAME: ${{ inputs.name }}
          CONFIG_PATH: ${{ inputs.config-path }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_OVERRIDE: ${{ inputs.alert-webhook-override }}
        run: >-
          canadalogin-release notify
          --status build-failure
          --config "$CONFIG_PATH"
          --environment "$BUILD_ENVIRONMENT"
          --sha "$GITHUB_SHA"
          --workflow-url "$WORKFLOW_URL"
          --detail "$BUILD_NAME"

  sbom:
    if: inputs.sbom-enabled && needs.build.outputs.result == 'success'
    needs: build
    name: Publish image SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: ${{ inputs.github-environment || inputs.environment }}
      deployment: false
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up release tooling
        uses: $/actions/setup

      - name: Resolve AWS role
        if: inputs.aws-role != ''
        id: resolve-role
        env:
          DEFAULT_ROLE: ${{ vars[inputs.aws-role] }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || '{}' }}
          ROLE_VARIABLE: ${{ inputs.aws-role }}
        run: |
          set -euo pipefail
          role="$DEFAULT_ROLE"
          configured=$(jq -r --arg name "$ROLE_VARIABLE" '.[$name] // empty' <<< "$RELEASE_PIPELINE_VARS")
          if [[ -n "$configured" ]]; then
            role="$configured"
          fi
          printf 'role=%s\n' "${role:-$ROLE_VARIABLE}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        if: inputs.aws-role != ''
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id || vars.AWS_ACCOUNT_ID }}:role/${{ steps.resolve-role.outputs.role }}
          role-session-name: CanadaLoginReleaseSbom
          aws-region: ${{ inputs.aws-region }}

      - name: Log in to Amazon ECR
        if: inputs.kind == 'docker'
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Generate image SBOM
        uses: cds-snc/security-tools/.github/actions/generate-sbom@d123fa2b895f7ef5b400fad333d2101b103b2e64 # v4.0.4
        env:
          TRIVY_DB_REPOSITORY: ${{ vars.TRIVY_DB_REPOSITORY }}
        with:
          docker_image: ${{ needs.build.outputs.image_uri }}
          dockerfile_path: ${{ inputs.sbom-dockerfile }}
          sbom_name: ${{ inputs.sbom-name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack about SBOM failure
        if: failure() && inputs.notify-failure
        env:
          BUILD_ENVIRONMENT: ${{ inputs.target-environment }}
          BUILD_NAME: ${{ inputs.name }}
          CONFIG_PATH: ${{ inputs.config-path }}
          RELEASE_PIPELINE_VARS: ${{ inputs.release-pipeline-vars || toJSON(vars) }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_1 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_2 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_3 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_4 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5: ${{ secrets.RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_5 }}
          RELEASE_PIPELINE_DEPLOY_ALERTS_SLACK_WEBHOOK_OVERRIDE: ${{ inputs.alert-webhook-override }}
        run: >-
          canadalogin-release notify
          --status build-failure
          --config "$CONFIG_PATH"
          --environment "$BUILD_ENVIRONMENT"
          --sha "$GITHUB_SHA"
          --workflow-url "$WORKFLOW_URL"
          --detail "$BUILD_NAME SBOM"