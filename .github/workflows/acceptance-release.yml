# The equivalent of release-system.yml, but with extra inputs exposed
# for acceptance testing. Besides the additional inputs, it hits the
# same underlying workflow.

name: Acceptance release pipeline

on:
  workflow_call:
    outputs:
      release-result:
        description: Actual conclusion of the nested release jobs.
        value: ${{ jobs.release.outputs.release-result }}
      required-builds-result:
        description: Actual conclusion of the nested required-builds job.
        value: ${{ jobs.release.outputs.required-builds-result }}
      deploy-result:
        description: Actual conclusion of the nested deployment job.
        value: ${{ jobs.release.outputs.deploy-result }}
    inputs:
      config-path:
        description: Path to the acceptance release configuration.
        required: true
        type: string
      aws-account-id:
        description: AWS account hosting the acceptance resources.
        required: true
        type: string
      aws-region:
        description: AWS region hosting the acceptance resources.
        required: true
        type: string
      github-environment:
        description: GitHub environment hosting the acceptance variables and secrets.
        required: true
        type: string
      create-deployment:
        description: Create a GitHub deployment record for the acceptance environment.
        required: true
        type: boolean
      pipeline-id:
        description: Acceptance pipeline concurrency namespace.
        required: true
        type: string
      environment:
        description: Acceptance deployment target.
        required: true
        type: string
      rebuild:
        description: Rebuild artifacts during the acceptance deployment.
        required: true
        type: boolean
      release-pipeline-vars:
        description: Per-test non-secret schema 2 infrastructure variables.
        required: true
        type: string
      alert-webhook-override:
        description: Optional isolated endpoint used to capture failure alerts.
        required: true
        type: string
      allow-failure:
        description: Allow an acceptance fixture's intended release failure.
        required: true
        type: boolean

jobs:
  release:
    uses: $/.github/workflows/internal-release-system-interface.yml
    with:
      config-path: ${{ inputs.config-path }}
      aws-account-id: ${{ inputs.aws-account-id }}
      aws-region: ${{ inputs.aws-region }}
      github-environment: ${{ inputs.github-environment }}
      create-deployment: ${{ inputs.create-deployment }}
      pipeline_id: ${{ inputs.pipeline-id }}
      environment: ${{ inputs.environment }}
      rebuild: ${{ inputs.rebuild }}
      release-pipeline-vars: ${{ inputs.release-pipeline-vars }}
      alert-webhook-override: ${{ inputs.alert-webhook-override }}
      allow-failure: ${{ inputs.allow-failure }}
    secrets: inherit