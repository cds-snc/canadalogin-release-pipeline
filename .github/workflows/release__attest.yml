# Sign SLSA build provenance for one container image digest.
# This workflow is called only by the `attest` job of `release__build.yml`.
#
# Why this is its own file: a Sigstore signing certificate identifies the reusable workflow FILE and ref
# (job_workflow_ref), not the job. Other jobs in `release__build.yml` hold `id-token: write` and run caller-controlled
# code (npm install scripts, build commands), so any of them could mint a certificate with that file's identity.
# Deployments trust only this file's identity, which keeps signing out of reach of caller build steps.
#
# Keep this workflow minimal: it must never check out the caller repository, install tooling, run shell steps, use a
# GitHub environment, or call any action other than `actions/attest`. Anything else belongs in `release__build.yml`.

name: Attest image build provenance

on:
  workflow_call:
    inputs:
      subject-name:
        description: Fully qualified image repository, without a tag or digest.
        required: true
        type: string
      subject-digest:
        description: Image manifest digest (sha256:<hex>) pushed by the calling build.
        required: true
        type: string

permissions: {}

jobs:
  attest:
    name: Sign build provenance
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Generate and store build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ inputs.subject-name }}
          subject-digest: ${{ inputs.subject-digest }}
