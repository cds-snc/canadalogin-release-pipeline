# The top-level orchestration workflow for release-please acceptance tests.

name: Integration / acceptance tests

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

env:
  AWS_ACCOUNT_ID: "429694360874"
  AWS_REGION: ca-central-1

concurrency:
  group: canadalogin-release-acceptance-tests
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  validate_release_pull_request:
    name: Validate release pull request
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release-please--branches--main' &&
      github.event.pull_request.user.type == 'Bot' &&
      contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-please pull request
        run: true

  discover:
    name: Discover acceptance tests
    needs: validate_release_pull_request
    if: needs.validate_release_pull_request.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout prospective release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up release tooling
        uses: ./actions/setup

      - name: Build acceptance test matrix
        id: matrix
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: python3 acceptance/runner.py matrix --github-output

  terraform:
    name: Apply acceptance infrastructure
    needs: [validate_release_pull_request, discover]
    if: needs.validate_release_pull_request.result == 'success' && needs.discover.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: acceptance-tests
      deployment: false
    steps:
      - name: Checkout prospective release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm prospective SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/cl-acceptance-terraform
          role-session-name: CanadaLoginAcceptanceTerraform
          aws-region: ${{ env.AWS_REGION }}

      - name: Bootstrap Terraform state store
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_STATE_BUCKET: cl-acceptance-tfstate-${{ env.AWS_ACCOUNT_ID }}
          TF_STATE_LOCK_TABLE: cl-acceptance-tfstate-lock-${{ env.AWS_ACCOUNT_ID }}
        run: ./acceptance/scripts/bootstrap-terraform-state.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.4

      - name: Format and initialize Terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_STATE_BUCKET: cl-acceptance-tfstate-${{ env.AWS_ACCOUNT_ID }}
          TF_STATE_LOCK_TABLE: cl-acceptance-tfstate-lock-${{ env.AWS_ACCOUNT_ID }}
        run: |
          terraform -chdir=acceptance/terraform fmt -check -no-color -recursive
          terraform -chdir=acceptance/terraform init -input=false -no-color -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=release-pipeline-acceptance/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="dynamodb_table=$TF_STATE_LOCK_TABLE"
          terraform -chdir=acceptance/terraform validate -no-color

      - name: Apply acceptance Terraform
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          TF_VAR_aws_account_id: ${{ env.AWS_ACCOUNT_ID }}
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_github_oidc_subject_prefix: repo:${{ github.repository_owner }}@${{ github.repository_owner_id }}/${{ github.event.repository.name }}@${{ github.repository_id }}
        run: terraform -chdir=acceptance/terraform apply -input=false -auto-approve -no-color

  acceptance:
    name: Acceptance test (${{ matrix.id }})
    needs: [terraform, discover]
    if: needs.terraform.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/acceptance__run-one-acceptance-test.yml
    with:
      test-id: ${{ matrix.id }}
      release-sha: ${{ github.event.pull_request.head.sha }}
      config-path: ${{ matrix.config_path }}
      terraform-directory: ${{ matrix.terraform_directory }}
      environment: ${{ matrix.environment }}
      github-environment: ${{ matrix.github_environment }}
      aws-role: ${{ matrix.aws_role }}
      aws-account-id: ${{ matrix.aws_account_id }}
      aws-region: ${{ matrix.aws_region }}
      pipeline-id-prefix: ${{ matrix.pipeline_id_prefix }}
      expected-release-result: ${{ matrix.expected_release_result }}
      rebuild: ${{ matrix.rebuild }}
      release-pipeline-vars: ${{ matrix.release_pipeline_vars }}
    secrets: inherit

  report:
    name: Report integration / acceptance suite result
    if: always() && needs.validate_release_pull_request.result == 'success'
    needs: [validate_release_pull_request, terraform, acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      statuses: write
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up release tooling
        uses: ./actions/setup

      - name: Publish acceptance result
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          VALIDATION_RESULT: ${{ needs.validate_release_pull_request.result }}
          TERRAFORM_RESULT: ${{ needs.terraform.result }}
          ACCEPTANCE_RESULT: ${{ needs.acceptance.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python3 acceptance/runner.py report
          --pull-request "$PR_NUMBER"
          --release-sha "$RELEASE_SHA"
          --repository "$REPOSITORY"
          --run-url "$RUN_URL"
          --validation-result "$VALIDATION_RESULT"
          --terraform-result "$TERRAFORM_RESULT"
          --acceptance-result "$ACCEPTANCE_RESULT"
          --api-url "$GITHUB_API_URL"