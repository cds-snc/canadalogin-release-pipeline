schema_version: 2
application: partner-portal
profile: spa-ecs

environments: [dev]

notifications:
  alert_webhooks:
    - secret: GC_SIGNIN_OPS_SLACK_ALERT_WEBHOOK
    - secret: CL_DEV_SLACK_ALERT_WEBHOOK

frontend:
  package_manager: pnpm
  package_manager_version: 9.15.4
  environment:
    VITE_API_BASE_URL:
      var: VITE_API_BASE_URL
    VITE_APP_ENVIRONMENT:
      var: VITE_APP_ENVIRONMENT
    VITE_AUTH_POST_LOGIN_PATH:
      var: VITE_AUTH_POST_LOGIN_PATH
      default: /your-applications
    VITE_SESSION_WARNING_AFTER_MINUTES:
      var: VITE_SESSION_WARNING_AFTER_MINUTES
      default: "25"
    VITE_SESSION_COUNTDOWN_MINUTES:
      var: VITE_SESSION_COUNTDOWN_MINUTES
      default: "5"
    VITE_RELEASE_TAG: "{release_version}"
  delete_stale_files: true
  invalidation_paths: [/index.html, /assets/*, /locales/*]

backend:
  dockerfile: backend/Dockerfile
  build_args:
    APP_VERSION: "{release_version}"
  services: [web, worker]